workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS == null

stages:
  - test
  - build
  - migrate
  - deploy

variables:
  IMAGE_NAME: $CI_REGISTRY_IMAGE
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA

test:
  stage: test
  image: golang:1.26-alpine
  script:
    - go install github.com/boumenot/gocover-cobertura@latest
    - cd backend
    - go test -coverprofile=coverage.out ./...
    - $GOPATH/bin/gocover-cobertura < coverage.out > coverage.xml
  cache:
    key: go-mod-$CI_COMMIT_REF_SLUG
    paths:
      - .go/pkg/mod/
  variables:
    GOPATH: $CI_PROJECT_DIR/.go
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage.xml
  coverage: '/coverage: \d+\.\d+% of statements/'

build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $IMAGE_NAME:$IMAGE_TAG -t $IMAGE_NAME:latest backend
    - docker push $IMAGE_NAME:$IMAGE_TAG
    - docker push $IMAGE_NAME:latest

.dev_deploy_base:
  stage: deploy
  needs: [build]
  image:
    name: bitnami/kubectl:latest
    entrypoint: [""]
  before_script:
    - mkdir -p ~/.kube
    - echo "$KUBE_CONFIG" | base64 -d > ~/.kube/config
    - chmod 600 ~/.kube/config
  script:
    - kubectl set image deployment/$K8S_DEPLOYMENT_NAME
        $K8S_CONTAINER_NAME=$IMAGE_NAME:$IMAGE_TAG
        --namespace=$K8S_NAMESPACE
    - kubectl rollout status deployment/$K8S_DEPLOYMENT_NAME
        --namespace=$K8S_NAMESPACE
        --timeout=120s

migrate:dev:
  stage: migrate
  needs: [build]
  image:
    name: bitnami/kubectl:latest
    entrypoint: [""]
  before_script:
    - mkdir -p ~/.kube
    - echo "$KUBE_CONFIG" | base64 -d > ~/.kube/config
    - chmod 600 ~/.kube/config
  script:
    - kubectl delete job cu-faculty-migrate --namespace=$K8S_NAMESPACE --ignore-not-found
    - sed "s|IMAGE_PLACEHOLDER|$IMAGE_NAME:$IMAGE_TAG|g" deployments/k8s/migrate-job.yaml
        | kubectl apply --namespace=$K8S_NAMESPACE -f -
    - |
      for i in $(seq 1 60); do
        succeeded=$(kubectl get job cu-faculty-migrate --namespace=$K8S_NAMESPACE -o jsonpath='{.status.succeeded}')
        failed=$(kubectl get job cu-faculty-migrate --namespace=$K8S_NAMESPACE -o jsonpath='{.status.failed}')
        if [ "$succeeded" = "1" ]; then echo "migrations applied"; break; fi
        if [ "$failed" = "1" ]; then
          echo "migration job failed"
          kubectl logs job/cu-faculty-migrate --namespace=$K8S_NAMESPACE || true
          exit 1
        fi
        sleep 3
      done
      if [ "$succeeded" != "1" ]; then
        echo "migration job did not complete in time"
        kubectl logs job/cu-faculty-migrate --namespace=$K8S_NAMESPACE || true
        exit 1
      fi
    - kubectl logs job/cu-faculty-migrate --namespace=$K8S_NAMESPACE
  variables:
    K8S_NAMESPACE: dev
  environment:
    name: dev
  rules:
    - when: manual

deploy:dev:
  extends: .dev_deploy_base
  environment:
    name: dev
  variables:
    K8S_NAMESPACE: dev
    K8S_DEPLOYMENT_NAME: cu-faculty-backend
    K8S_CONTAINER_NAME: cu-faculty-backend
  rules:
    - when: manual
