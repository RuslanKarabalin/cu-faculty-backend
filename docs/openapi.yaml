      responses:
        "201":
          description: Created work place
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkPlace" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/me/work-places/{workId}:
    put:
      tags: [Me]
      summary: Update a work place
      operationId: updateWorkPlace
      parameters:
        - $ref: "#/components/parameters/WorkId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkPlaceRequest" }
      responses:
        "200":
          description: Updated work place
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkPlace" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [Me]
      summary: Delete a work place
      operationId: deleteWorkPlace
      parameters:
        - $ref: "#/components/parameters/WorkId"
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/me/socials:
    get:
      tags: [Me]
      summary: List my socials
      operationId: getMySocials
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Paged socials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SocialPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Me]
      summary: Create a social link
      operationId: createSocial
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SocialRequest" }
      responses:
        "201":
          description: Created social
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Social" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/me/socials/{socialId}:
    put:
      tags: [Me]
      summary: Update a social link
      operationId: updateSocial
      parameters:
        - $ref: "#/components/parameters/SocialId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SocialRequest" }
      responses:
        "200":
          description: Updated social
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Social" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
