openapi: 3.0.3
info:
  title: CU Faculty Backend API
  version: "1.0.0"
  description: >
    REST API for the CU Faculty student hub. All endpoints under `/api` require a
    valid `bff.cookie` session cookie, which is validated against the Central
    University (CU) upstream on every request. The authenticated CU student id is
    used as the local user id. The only unauthenticated endpoint is `/health`.


    List endpoints are paginated and return a `{ data, total, limit, offset }`
    envelope. Pagination is controlled with the `limit` (default 20, max 100) and
    `offset` (default 0) query parameters.

servers:
  - url: /
    description: Same-origin (nginx proxies /api to the backend)

security:
  - cookieAuth: []

tags:
  - name: Health
  - name: Students
  - name: Me
  - name: Announcements
  - name: News
  - name: Events
  - name: Reference

paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness/readiness probe
      operationId: health
      security: []
      responses:
        "200":
          description: Service healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
        "503":
          description: Database unreachable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: unhealthy }

  /api/students/register:
    post:
      tags: [Students]
      summary: Register (or return) the current CU user
      description: >
        Idempotent. On first call creates the local user (and imports education
        places from CU) and returns 201. On subsequent calls returns the existing
        user with 200. Optionally accepts multipart/form-data with a JSON `data`
        part (profile fields) and/or a `photo` image part; supplying `data`
        updates the profile fields and supplying `photo` sets (or replaces) the
        user's photo in the same request.
      operationId: registerStudent
      requestBody:
        required: false
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                data:
                  allOf:
                    - $ref: "#/components/schemas/UpdateUserRequest"
                photo:
                  type: string
                  format: binary
                  description: Optional image file (Content-Type must start with image/)
            encoding:
              data:
                contentType: application/json
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "200":
          description: User already existed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/students:
    get:
      tags: [Students]
      summary: List students
      operationId: listStudents
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Paged students
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/students/{id}:
    get:
      tags: [Students]
      summary: Get a student by id
      operationId: getStudent
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Student
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/students/{id}/edu-places:
    get:
      tags: [Students]
      summary: List a student's education places
      operationId: getStudentEduPlaces
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Paged education places
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EduPlacePage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/students/{id}/work-places:
    get:
      tags: [Students]
      summary: List a student's work places
      operationId: getStudentWorkPlaces
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Paged work places
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkPlacePage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/students/{id}/socials:
