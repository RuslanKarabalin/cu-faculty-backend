          description: Paged news
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NewsPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/me/events:
