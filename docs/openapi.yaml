components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: bff.cookie
      description: CU session cookie, validated against the CU upstream on every request.

  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: Page size (default 20, clamped to a maximum of 100).
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Offset:
      name: offset
      in: query
      required: false
      description: Number of items to skip (default 0).
      schema: { type: integer, minimum: 0, default: 0 }
    UserId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    SearchQuery:
      name: q
      in: query
      required: true
      description: Search term matched against first name, last name, and full name.
      schema: { type: string, minLength: 1 }
    ResourceId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    EduId:
      name: eduId
      in: path
      required: true
      schema: { type: integer }
    WorkId:
      name: workId
      in: path
      required: true
      schema: { type: integer }
    SocialId:
      name: socialId
      in: path
      required: true
      schema: { type: integer }
    SkillId:
      name: skillId
      in: path
      required: true
      schema: { type: integer }
    ContactId:
      name: contactId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SavedUserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing or rejected session cookie
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadGateway:
      description: Upstream (CU) error or invalid upstream data
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Resource already exists
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UnprocessableEntity:
      description: Request was well-formed but a field failed validation
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PayloadTooLarge:
      description: Request body exceeded the size limit
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      description: >
        Normalized error envelope returned by every error response. "error" is a
        human-readable message (not for programmatic use); "code" is a stable,
        machine-readable identifier clients may branch on.
      properties:
        error: { type: string, example: "announcement not found" }
        code:
          type: string
          example: not_found
          enum:
            - bad_request
            - validation_error
            - unauthorized
            - forbidden
            - not_found
            - conflict
            - already_exists
            - invalid_reference
            - payload_too_large
            - upstream_error
            - unavailable
            - internal_error
      required: [error, code]

