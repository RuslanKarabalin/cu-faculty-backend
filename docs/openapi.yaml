openapi: 3.0.3
info:
  title: CU Faculty Backend API
  version: "1.0.0"
  description: >
    REST API for the CU Faculty student hub. All endpoints under `/api` require a
    valid `bff.cookie` session cookie, which is validated against the Central
    University (CU) upstream on every request. The authenticated CU student id is
    used as the local user id. The only unauthenticated endpoint is `/health`.


    List endpoints are paginated and return a `{ data, total, limit, offset }`
    envelope. Pagination is controlled with the `limit` (default 20, max 100) and
    `offset` (default 0) query parameters.

security:
  - cookieAuth: []

tags:
  - name: Students
  - name: Me
  - name: Announcements
  - name: News
  - name: Events
  - name: Reference

paths:
  /api/students/register:
    post:
      tags: [Students]
      summary: Register (or return) the current CU user
      description: >
        Idempotent. On first call creates the local user (and imports education
        places from CU) and returns 201. On subsequent calls returns the existing
        user with 200. Identity comes entirely from the `bff.cookie` session; the
        only accepted body is an optional `photo` image part that sets (or
        replaces) the user's photo. No profile fields are read here - use
        `PUT /api/me` to edit those.
      operationId: registerStudent
      requestBody:
        required: false
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                photo:
                  type: string
                  format: binary
                  description: Optional image file (Content-Type must start with image/)
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "200":
          description: User already existed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/students:
    get:
      tags: [Students]
      summary: List students
      operationId: listStudents
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Paged students
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/students/search:
    get:
      tags: [Students]
      summary: Search students by first and last name
      description: >
        Case-insensitive substring match against first name, last name, and the
        full name ("first last"). Results exclude the current user and are ranked
        by relationship to the caller: saved users first, then contacts, then all
        other users; within each group they are ordered by name. Each result
        carries a `relation` field indicating which group it fell into.
      operationId: searchStudents
      parameters:
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Paged, ranked search results
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserSearchResultPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/students/{id}:
    get:
      tags: [Students]
      summary: Get a student by id
      operationId: getStudent
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Student
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/students/{id}/edu-places:
    get:
      tags: [Students]
      summary: List a student's education places
      operationId: getStudentEduPlaces
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Paged education places
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EduPlacePage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/students/{id}/work-places:
    get:
      tags: [Students]
      summary: List a student's work places
      operationId: getStudentWorkPlaces
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Paged work places
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkPlacePage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/students/{id}/socials:
    get:
      tags: [Students]
      summary: List a student's socials
      operationId: getStudentSocials
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Paged socials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SocialPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/students/{id}/key-skills:
    get:
      tags: [Students]
      summary: List a student's key skills
      operationId: getStudentKeySkills
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Paged skills
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SkillPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/students/{id}/soft-skills:
    get:
      tags: [Students]
      summary: List a student's soft skills
      operationId: getStudentSoftSkills
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Paged skills
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SkillPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/me:
    get:
      tags: [Me]
      summary: Get the current user
      operationId: getMe
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    put:
      tags: [Me]
      summary: Update the current user's profile
      description: >
        Accepts multipart/form-data with an optional JSON `data` part (profile
        fields) and an optional `photo` image part. Supplying `data` updates the
        profile fields; supplying `photo` sets (or replaces) the user's photo.
        Either or both parts may be omitted.
      operationId: updateMe
      requestBody:
        required: false
        description: >
          Actually sent as `multipart/form-data`: a JSON `data` part matching the
          schema below, plus an optional `photo` image part (Content-Type must
          start with `image/`) that sets or replaces the photo. Documented as
          `application/json` so the `data` schema renders; only the `data` part is
          shown here.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileData" }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/me/completeness:
    get:
      tags: [Me]
      summary: Get the current user's profile completeness
      description: >
        Returns the profile completeness as a percentage (0–100). Weights:
        photo 15, speciality 15, bio 10, birth date 5, each social / education
        place / key skill / soft skill 5, each work place 15. Capped at 100.
      operationId: getMyCompleteness
      responses:
        "200":
          description: Profile completeness
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileCompleteness" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/me/edu-places:
    get:
      tags: [Me]
      summary: List my education places
      operationId: getMyEduPlaces
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Paged education places
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EduPlacePage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Me]
      summary: Create an education place
      operationId: createEduPlace
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EduPlaceRequest" }
      responses:
        "201":
          description: Created education place
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EduPlace" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/me/edu-places/{eduId}:
    put:
      tags: [Me]
