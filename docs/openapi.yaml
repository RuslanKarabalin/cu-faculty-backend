        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/me:
    get:
      tags: [Me]
      summary: Get the current user
      operationId: getMe
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    put:
      tags: [Me]
      summary: Update the current user's profile
      description: >
        Accepts multipart/form-data with an optional JSON `data` part (profile
        fields) and an optional `photo` image part. Supplying `data` updates the
        profile fields; supplying `photo` sets (or replaces) the user's photo.
        Either or both parts may be omitted.
      operationId: updateMe
      requestBody:
        required: false
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                data:
                  allOf:
                    - $ref: "#/components/schemas/UpdateUserRequest"
                photo:
                  type: string
                  format: binary
                  description: Optional image file (Content-Type must start with image/)
            encoding:
              data:
                contentType: application/json
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/me/edu-places:
    get:
      tags: [Me]
