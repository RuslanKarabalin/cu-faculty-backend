        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Paged announcements
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnnouncementPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/me/event-responses:
    get:
      tags: [Me]
      summary: List events I responded to
      operationId: getMyEventResponses
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Paged events
          content:
