components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: bff.cookie
      description: CU session cookie, validated against the CU upstream on every request.

  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: Page size (default 20, clamped to a maximum of 100).
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Offset:
      name: offset
      in: query
      required: false
      description: Number of items to skip (default 0).
      schema: { type: integer, minimum: 0, default: 0 }
    UserId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ResourceId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    EduId:
      name: eduId
      in: path
      required: true
      schema: { type: integer }
    WorkId:
      name: workId
      in: path
      required: true
      schema: { type: integer }
    SocialId:
      name: socialId
      in: path
      required: true
      schema: { type: integer }
    SkillId:
      name: skillId
      in: path
      required: true
      schema: { type: integer }
    ContactId:
      name: contactId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing or rejected session cookie
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadGateway:
      description: Upstream (CU) error or invalid upstream data
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
      required: [error]

    PageMeta:
      type: object
      properties:
        total: { type: integer, description: Total number of matching items }
        limit: { type: integer }
        offset: { type: integer }
      required: [total, limit, offset]

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        photoUrl:
          type: string
          nullable: true
          description: Presigned, time-limited download URL for the user's photo.
        firstName: { type: string }
        lastName: { type: string }
        bio: { type: string, nullable: true }
        birthdate: { type: string, format: date, example: "2000-01-31" }
        speciality: { type: string, nullable: true }
        status: { type: string, nullable: true, description: Resolved status content }
        role: { type: string, enum: [user, admin] }
      required: [id, firstName, lastName, birthdate, role]

    UpdateUserRequest:
      type: object
      properties:
        bio: { type: string, nullable: true }
        speciality: { type: string, nullable: true }
        statusId: { type: integer, nullable: true }

    EduPlace:
      type: object
      properties:
        id: { type: integer }
        universityId: { type: integer }
        universityName: { type: string }
        grade: { $ref: "#/components/schemas/EduGrade" }
        level: { type: string, nullable: true }
        specialization: { type: string }
        startYear: { type: integer }
        endYear: { type: integer, nullable: true }
        isStudyingNow: { type: boolean }
      required: [id, universityId, universityName, grade, specialization, startYear, isStudyingNow]

    EduPlaceRequest:
      type: object
      properties:
        universityId: { type: integer }
        grade: { $ref: "#/components/schemas/EduGrade" }
        level: { type: string, nullable: true }
        specialization: { type: string }
        startYear: { type: integer }
        endYear: { type: integer, nullable: true }
        isStudyingNow: { type: boolean }
      required: [universityId, grade, specialization, startYear, isStudyingNow]

    WorkPlace:
      type: object
      properties:
        id: { type: integer }
        companyName: { type: string }
        grade: { $ref: "#/components/schemas/WorkGrade" }
        position: { type: string }
        startYear: { type: integer }
        endYear: { type: integer, nullable: true }
        isWorkingNow: { type: boolean }
      required: [id, companyName, grade, position, startYear, isWorkingNow]

    WorkPlaceRequest:
      type: object
      properties:
        companyName: { type: string }
        grade: { $ref: "#/components/schemas/WorkGrade" }
        position: { type: string }
        startYear: { type: integer }
        endYear: { type: integer, nullable: true }
        isWorkingNow: { type: boolean }
      required: [companyName, grade, position, startYear, isWorkingNow]

    Social:
      type: object
      properties:
        id: { type: integer }
        social: { $ref: "#/components/schemas/SocialNetwork" }
        link: { type: string }
        isPreferred: { type: boolean }
      required: [id, social, link, isPreferred]

    SocialRequest:
      type: object
      properties:
        social: { $ref: "#/components/schemas/SocialNetwork" }
        link: { type: string }
        isPreferred: { type: boolean }
      required: [social, link, isPreferred]

    Contact:
      type: object
      properties:
        note: { type: string, nullable: true }
        user: { $ref: "#/components/schemas/User" }
      required: [user]

    CreateContactRequest:
      type: object
      properties:
        contactId: { type: string, format: uuid }
        note: { type: string, nullable: true }
      required: [contactId]

    UpdateContactRequest:
      type: object
      properties:
        note: { type: string, nullable: true }

