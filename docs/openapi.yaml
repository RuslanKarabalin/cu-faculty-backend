          content:
            application/json:
              schema: { $ref: "#/components/schemas/SocialPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Me]
      summary: Create a social link
      operationId: createSocial
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SocialRequest" }
      responses:
        "201":
          description: Created social
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Social" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/me/socials/{socialId}:
    put:
      tags: [Me]
      summary: Update a social link
      operationId: updateSocial
      parameters:
        - $ref: "#/components/parameters/SocialId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SocialRequest" }
      responses:
