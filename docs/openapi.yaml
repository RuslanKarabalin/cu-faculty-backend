      summary: List my key skills
      operationId: getMyKeySkills
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Paged skills
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SkillPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/me/key-skills/{skillId}:
    post:
      tags: [Me]
      summary: Add a key skill to me
      operationId: addMyKeySkill
      parameters:
        - $ref: "#/components/parameters/SkillId"
      responses:
        "201":
          description: Added skill
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Skill" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [Me]
      summary: Remove a key skill from me
      operationId: deleteMyKeySkill
      parameters:
        - $ref: "#/components/parameters/SkillId"
      responses:
        "204": { description: Removed }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/me/soft-skills:
    get:
      tags: [Me]
      summary: List my soft skills
      operationId: getMySoftSkills
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Paged skills
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SkillPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/me/soft-skills/{skillId}:
    post:
      tags: [Me]
      summary: Add a soft skill to me
      operationId: addMySoftSkill
      parameters:
        - $ref: "#/components/parameters/SkillId"
