        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/me/contacts:
    get:
      tags: [Me]
      summary: List my contacts
      operationId: getMyContacts
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Paged contacts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Me]
      summary: Add a contact
      description: >
        Links the current user to another user in both directions. The reverse
        link is created without a note.
      operationId: createContact
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateContactRequest" }
      responses:
        "201":
          description: Created contact
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contact" }
        "400":
          description: Bad request or attempt to add yourself
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Referenced contact user does not exist
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Contact already exists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/me/contacts/{contactId}:
