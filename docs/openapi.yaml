        lastName: { type: string, maxLength: 31 }
        bio: { type: string, nullable: true, maxLength: 255 }
        birthdate: { type: string, format: date, example: "2000-01-31" }
        speciality: { type: string, nullable: true, maxLength: 63 }
        status: { type: string, nullable: true, maxLength: 127, description: Resolved status content }
